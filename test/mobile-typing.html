<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LexiQuest mobile typing test</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="lq-header">
    <button id="backBtn" class="icon-btn" style="visibility:hidden">←</button>
    <div class="brand">Lexi<span>Quest</span></div>
    <div class="spacer"></div>
    <button id="themeBtn" class="icon-btn">◐</button>
  </header>
  <main id="app"></main>
  <pre id="test-results">RUNNING</pre>

  <script src="../js/data/words.js"></script>
  <script src="../js/data/petals.js"></script>
  <script src="../js/data/quizbank.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/games/quiz-engine.js"></script>
  <script src="../js/games/guess.js"></script>
  <script src="../js/games/petals.js"></script>
  <script src="../js/games/missing.js"></script>
  <script src="../js/games/vocab.js"></script>
  <script src="../js/games/thing.js"></script>
  <script src="../js/games/spell.js"></script>
  <script src="../js/games/truefalse.js"></script>
  <script src="../js/games/rhyme.js"></script>
  <script src="../js/games/trek.js"></script>

  <script>
  /* Simulates a mobile soft keyboard: no useful keydown events — letters arrive
     as value mutations + "input" events on the focused field, exactly like
     GBoard/iOS do against the hidden .type-catcher input. */
  (async function () {
    const results = [];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => [...document.querySelectorAll(sel)];
    const goto = async (id) => { location.hash = "#/g/" + id; await wait(50); };
    const assert = (name, cond) => results.push((cond ? "PASS " : "FAIL ") + name);
    const dayNumber = () => Math.floor(Date.now() / 86400000);

    function softType(catcher, word) {
      for (const ch of word) {
        catcher.value += ch;
        catcher.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: ch }));
      }
    }
    function softBackspace(catcher) {
      catcher.value = catcher.value.slice(0, -1);
      catcher.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteContentBackward" }));
    }
    function softEnter(catcher) {
      catcher.dispatchEvent(new InputEvent("beforeinput", { bubbles: true, cancelable: true, inputType: "insertLineBreak" }));
    }
    function tapFocus(container) {
      container.click(); // games focus the catcher on tap
      return container.querySelector(".type-catcher");
    }

    window.addEventListener("error", (e) => results.push("FAIL js-error: " + e.message));

    try {
      // quad: tap the boards, "type" a word on the soft keyboard, submit via enter
      await goto("quad");
      let catcher = tapFocus($(".boards"));
      assert("quad has catcher, focused on tap", !!catcher && document.activeElement === catcher);
      assert("quad catcher primed with sentinel", catcher.value === " ");
      softType(catcher, "cra");
      softBackspace(catcher);
      softType(catcher, "ane");
      softEnter(catcher);
      await wait(50);
      const row0 = $(".board .tile-row");
      assert("quad scores soft-typed guess",
        [...row0.children].every((t) => t.classList.contains("good") ||
          t.classList.contains("near") || t.classList.contains("bad")));
      assert("quad row reads 'crane' (incl. backspace)",
        [...row0.children].map((t) => t.textContent).join("") === "crane");
      assert("quad catcher reset after typing", catcher.value === " ");

      // petals: tap the word line, soft-type today's first valid word, enter
      await goto("petals");
      const puzzle = LQ_DATA.PETALS[dayNumber() % LQ_DATA.PETALS.length];
      catcher = tapFocus($(".word-entry"));
      assert("petals has catcher", !!catcher);
      softType(catcher, puzzle.words[0]);
      softEnter(catcher);
      await wait(50);
      assert("petals accepts soft-typed word", $$(".found-words .chip").length === 1);

      // missing: tap the card, soft-type the missing letter
      await goto("missing");
      const mSet = LQ_DATA.MISSING[dayNumber() % LQ_DATA.MISSING.length];
      const r0 = mSet.rounds[0];
      catcher = tapFocus($(".quiz-q"));
      assert("missing has catcher", !!catcher);
      softType(catcher, r0.word[r0.blank]);
      await wait(50);
      assert("missing collects soft-typed letter", $(".ml-secret .tile").textContent === r0.word[r0.blank]);

      // rhyme: tap the tiles, soft-type both words, enter to submit
      await goto("rhyme");
      // answer comes from the same seeded shuffle the game uses
      const rnd = LQ.mulberry32(dayNumber() * 31 + 7);
      const order = LQ.shuffled(LQ_DATA.RHYME, rnd);
      const item = order[0];
      catcher = tapFocus($(".rhyme-slots"));
      assert("rhyme has catcher", !!catcher);
      softType(catcher, item.w1 + item.w2);
      softEnter(catcher);
      await wait(50);
      assert("rhyme solves soft-typed riddle", $(".quiz-feedback").textContent.includes("Got it"));

      // physical typing must not double-fire while the catcher is focused:
      // a real keydown bubbling from the catcher is stopped before document handlers
      await goto("quad");
      catcher = tapFocus($(".boards"));
      catcher.dispatchEvent(new KeyboardEvent("keydown", { key: "a", bubbles: true, cancelable: true }));
      // (browser would now mutate the field and fire input — emulate it)
      softType(catcher, "a");
      await wait(20);
      const tiles = $$(".board")[0].children[0].children;
      assert("no double letters from physical keys",
        tiles[0].textContent === "a" && tiles[1].textContent === "");
    } catch (e) {
      results.push("FAIL exception: " + e.message);
    }

    document.getElementById("test-results").textContent =
      results.join("\n") + "\nDONE " + (results.every((r) => r.startsWith("PASS")) ? "ALL_PASS" : "HAS_FAILURES");
  })();
  </script>
</body>
</html>
